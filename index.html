<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>レジごっこ</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f7f9fa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #ff6b6b;
      font-size: 24px;
    }
    #preview-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      border: 4px solid #ffcbd1;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      display: block;
    }
    #result {
      margin-top: 20px;
      font-size: 28px;
      font-weight: bold;
      color: #333;
      min-height: 80px;
    }
    .btn {
      background-color: #ff6b6b;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn:active {
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <h1>🍞 おみせやさんレジ 🍎</h1>
  
  <div id="preview-container">
    <video id="video" autoplay playsinline></video>
  </div>

  <div id="result">QRコードを<br>うつしてね！</div>
  
  <!-- このボタンを押した瞬間に、ブラウザの音声機能を「許可」状態に引き込みます -->
  <button class="btn" onclick="initAndStart()">カメラをスタート</button>

  <script>
    const video = document.getElementById('video');
    const resultDiv = document.getElementById('result');
    let isScanning = false; // 最初はスキャンを無効にしておき、ボタン押下で開始

    // スマホのセキュリティ対策：ユーザーがボタンを押した瞬間に音声を一度「空撃ち」してロック解除する
    function initAndStart() {
      // 空の音声を発音させてブラウザの音声ブロックを解除
      if ('speechSynthesis' in window) {
        const dummyUtterance = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(dummyUtterance);
      }
      
      // カメラの起動へ
      startCamera();
    }

    function startCamera() {
      const constraints = {
        video: {
          facingMode: 'environment',
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => {
          video.srcObject = stream;
          video.onloadedmetadata = function(e) {
            video.play();
          };
          isScanning = true; // カメラが映ったらスキャンを開始
          requestAnimationFrame(tick);
        })
        .catch(err => {
          alert('カメラが見つからないか、許可されていません。');
          console.error(err);
        });
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'dontInvert',
        });

        if (code) {
          isScanning = false; // 連打防止のために一時停止
          const qrData = code.data;
          
          resultDiv.innerHTML = "さがしています...";

          // スプレッドシートからデータを取ってくるGASの関数を呼び出し
          google.script.run
            .withSuccessHandler(function(product) {
              if (product) {
                const speakText = `${product.name}、${product.price}円！`;
                resultDiv.innerHTML = `<span style="color:#ff6b6b;">${product.name}</span><br>${product.price}円`;
                speakWithWebSpeech(speakText);
              } else {
                resultDiv.innerHTML = "みつかりませんでした";
                speakWithWebSpeech("あれれ？みつからないよ");
                setTimeout(() => { isScanning = true; }, 2000);
              }
            })
            .getProduct(qrData);
        }
      }
      if (isScanning) {
        requestAnimationFrame(tick);
      }
    }

    // playVoiceの代わりにブラウザ標準のSpeechSynthesisを使う関数
    function speakWithWebSpeech(text) {
      if ('speechSynthesis' in window) {
        // 現在喋っている音声をすべて強制停止（バグ防止）
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';  // 日本語
        utterance.rate = 1.0;      // 速度（1.0が標準）
        utterance.pitch = 1.1;     // 声の高さ（少し高めで可愛く）

        // 喋り終わったらスキャンを再開する
        utterance.onend = function() {
          setTimeout(() => {
            resultDiv.innerHTML = "つぎのQRコードを<br>うつしてね！";
            isScanning = true;
            requestAnimationFrame(tick);
          }, 1500);
        };

        // 発話実行
        window.speechSynthesis.speak(utterance);
      } else {
        alert('このブラウザは音声読み上げに対応していません。');
        isScanning = true;
      }
    }
  </script>
</body>
</html>
