<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>レジごっこ (巨大丸ボタン版)</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #f7f9fa;
      font-family: sans-serif;
      overflow: hidden; /* 画面を固定してスクロールを防止 */
    }
    
    /* 📺 上半分：カメラ画面 */
    .top-container {
      height: 50%;
      width: 100%;
      background: #000;
      position: relative;
    }
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    
    /* 🍏 下半分：結果表示エリア（丸ボタンの背景になります） */
    .bottom-container {
      height: 50%;
      width: 100%;
      position: relative;
      background-color: #ffffff;
      border-top: 4px solid #ffcbd1;
      box-sizing: border-box;
    }

    #result { 
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold; 
      color: #333; 
      text-align: center;
      box-sizing: border-box;
      padding: 10px;
      font-size: 48px; 
      line-height: 1.4;
    }

    /* 🔴【ここが主役】下半分の高さに合わせた巨大丸ボタン */
    .huge-circle-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%); /* 画面の真ん中にぴったり配置 */
      
      /* 下半分の高さ（50vh）から、上下の少しの余白を引いたサイズ（44vh）で綺麗な正円を作ります */
      width: 44vh;
      height: 44vh;
      max-width: 85vw;  /* 横幅が狭いスマホでも画面からはみ出さないためのセーフティ */
      max-height: 85vw;
      
      border-radius: 50%; /* これで綺麗な丸になります */
      background-color: #ff6b6b; 
      color: white; 
      border: none; 
      font-size: 28px; 
      font-weight: bold;
      cursor: pointer; 
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4); /* ボタンが立体的に見える影 */
      z-index: 100; 
      transition: all 0.1s ease;
      
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1.3;
    }
    
    /* ボタンを押したときのぷにっとしたアニメーション */
    .huge-circle-btn:active {
      background-color: #fa5252; 
      transform: translate(-50%, -46%) scale(0.95); /* ちょっと沈むような動き */
      box-shadow: 0 4px 10px rgba(255, 107, 107, 0.2);
    }
  </style>
</head>
<body>

  <div class="top-container">
    <video id="video" autoplay playsinline></video>
  </div>

  <div class="bottom-container">
    <div id="result">QRコードを<br>うつしてね！</div>
    
    <button id="start-btn" class="huge-circle-btn" onclick="initAndStart()">ここをおして<br>スタート！</button>
  </div>

  <script {nonce}>
    const video = document.getElementById('video');
    const resultDiv = document.getElementById('result');
    const startBtn = document.getElementById('start-btn');
    let isScanning = false;
    let productSheetsData = []; 

    async function loadJsonData() {
      try {
        const response = await fetch('./products.json'); 
        productSheetsData = await response.json();
      } catch (error) {
        console.error("JSONファイルの読み込みに失敗しました:", error);
      }
    }

    function initAndStart() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
      }
      
      // ボタンを消してスキャン待ちにする
      startBtn.style.display = 'none';
      
      startCamera();
    }

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ 
        video: { 
          facingMode: 'environment', 
          width: { ideal: 1280 }, 
          height: { ideal: 720 } 
        }, 
        audio: false 
      })
      .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => video.play();
        isScanning = true;
        requestAnimationFrame(tick);
      })
      .catch(err => { alert('カメラの起動に失敗しました。'); });
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });

        if (code) {
          isScanning = false;
          const qrData = code.data.trim();
          resultDiv.innerHTML = "<span style='font-size: 36px; color: #999;'>さがしています...</span>";

          const product = productSheetsData.find(p => p.id === qrData);

          if (product) {
            const speakText = `${product.name}、${product.price}円！`;
            resultDiv.innerHTML = `<div style="width: 100%;"><span style="color:#ff6b6b; font-size: 56px;">${product.name}</span><br><span style="font-size: 76px; color: #111;">${product.price}円</span></div>`;
            speakWithWebSpeech(speakText);
          } else {
            resultDiv.innerHTML = `<div style="width: 100%;"><span style="color:#ff6b6b; font-size: 42px;">あれれ！<br>みつからないよ</span><br><span style="font-size: 24px; color: #666; display:block; margin-top:10px;">データ: ${qrData}</span></div>`;
            speakWithWebSpeech("あれれ？みつからないよ");
            setTimeout(() => { isScanning = true; }, 3500); 
          }
        }
      }
      if (isScanning) { requestAnimationFrame(tick); }
    }

    function speakWithWebSpeech(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP'; 
        
        utterance.rate = 1.05; 
        utterance.pitch = 1.05; 

        const voices = window.speechSynthesis.getVoices();
        let siriVoice = voices.find(v => v.lang.includes('ja') && v.name.includes('Siri'));
        
        if (siriVoice) {
          utterance.voice = siriVoice;
        } else {
          let backupVoice = voices.find(v => v.lang.includes('ja'));
          if (backupVoice) utterance.voice = backupVoice;
          utterance.pitch = 1.35; 
        }

        utterance.onend = () => {
          setTimeout(() => { resultDiv.innerHTML = "つぎのQRコードを<br>うつしてね！"; isScanning = true; requestAnimationFrame(tick); }, 1500);
        };
        window.speechSynthesis.speak(utterance);
      } else {
        isScanning = true;
      }
    }

    window.onload = loadJsonData;
  </script>
</body>
</html>
