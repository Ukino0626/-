<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>レジごっこ (巨大ボタン版)</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    /* 画面全体の配置をスマホに最適化 */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #f7f9fa;
      font-family: sans-serif;
      overflow: hidden; /* スクロールを禁止してレジ画面を固定 */
    }
    
    /* 上半分のコンテンツエリア */
    .top-container {
      height: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      padding: 10px;
    }

    h1 { 
      color: #ff6b6b; 
      font-size: 22px; 
      margin: 0 0 10px 0; 
    }
    
    #preview-container { 
      position: relative; 
      width: 90%; 
      max-width: 500px; 
      height: 65%; /* 上半分のスペースに収まるよう調整 */
      border: 5px solid #ffcbd1; 
      border-radius: 12px; 
      overflow: hidden; 
      background: #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; /* 枠いっぱいにカメラ映像を広げる */
    }
    
    /* 🍏 結果表示エリア（ボタンが消えた後はここが下半分に広がります） */
    #result { 
      height: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px; 
      font-weight: bold; 
      color: #333; 
      background-color: #ffffff;
      border-top: 2px dashed #ffcbd1;
      box-sizing: border-box;
      padding: 20px;
      text-align: center;
    }

    /* 🚨【ここが主役】下半分をすべて埋め尽くす巨大ボタン */
    .huge-btn {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%; /* 画面の下半分ぴったり（50%） */
      background-color: #ff6b6b; 
      color: white; 
      border: none; 
      font-size: 28px; 
      font-weight: bold;
      cursor: pointer; 
      box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
      z-index: 100; /* 一番手前に表示 */
      transition: background-color 0.2s;
    }
    .huge-btn:active {
      background-color: #fa5252; /* タップした瞬間に少し色が変わる */
    }
  </style>
</head>
<body>

  <div class="top-container">
    <h1>🍞 おみせやさんレジ 🍎</h1>
    <div id="preview-container">
      <video id="video" autoplay playsinline></video>
    </div>
  </div>

  <div id="result">下のボタンを<br>おしてね！</div>

  <button id="start-btn" class="huge-btn" onclick="initAndStart()">ここをおして<br>カメラをスタート！</button>

  <script {nonce}>
    const video = document.getElementById('video');
    const resultDiv = document.getElementById('result');
    const startBtn = document.getElementById('start-btn');
    let isScanning = false;
    let productSheetsData = []; 

    async function loadJsonData() {
      try {
        const response = await fetch('./products.json'); 
        productSheetsData = await response.json();
      } catch (error) {
        console.error("JSONファイルの読み込みに失敗しました:", error);
      }
    }

    function initAndStart() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
      }
      
      // 🌟 ボタンをパッと消して、下半分を「結果表示（スキャン待ち）」エリアにする
      startBtn.style.display = 'none';
      resultDiv.innerHTML = "QRコードを<br>うつしてね！";
      
      startCamera();
    }

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ 
        video: { 
          facingMode: 'environment', 
          width: { ideal: 1280 }, 
          height: { ideal: 720 } 
        }, 
        audio: false 
      })
      .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => video.play();
        isScanning = true;
        requestAnimationFrame(tick);
      })
      .catch(err => { alert('カメラの起動に失敗しました。'); });
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });

        if (code) {
          isScanning = false;
          const qrData = code.data.trim();
          resultDiv.innerHTML = "さがしています...";

          const product = productSheetsData.find(p => p.id === qrData);

          if (product) {
            const speakText = `${product.name}、${product.price}円！`;
            resultDiv.innerHTML = `<span style="color:#ff6b6b; font-size: 38px;">${product.name}</span><br><br><span style="font-size: 45px; color: #333;">${product.price}円</span>`;
            speakWithWebSpeech(speakText);
          } else {
            resultDiv.innerHTML = `<span style="color:#ff6b6b; font-size: 26px;">あれれ、みつからないよ</span><br><br><span style="font-size: 18px; color: #555;">よみとったデータ:<br>${qrData}</span>`;
            speakWithWebSpeech("あれれ？みつからないよ");
            setTimeout(() => { isScanning = true; }, 3500); 
          }
        }
      }
      if (isScanning) { requestAnimationFrame(tick); }
    }

    function speakWithWebSpeech(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP'; 
        
        utterance.rate = 1.05; 
        utterance.pitch = 1.05; 

        const voices = window.speechSynthesis.getVoices();
        let siriVoice = voices.find(v => v.lang.includes('ja') && v.name.includes('Siri'));
        
        if (siriVoice) {
          utterance.voice = siriVoice;
        } else {
          let backupVoice = voices.find(v => v.lang.includes('ja'));
          if (backupVoice) utterance.voice = backupVoice;
          utterance.pitch = 1.35; 
        }

        utterance.onend = () => {
          setTimeout(() => { resultDiv.innerHTML = "つぎのQRコードを<br>うつしてね！"; isScanning = true; requestAnimationFrame(tick); }, 1500);
        };
        window.speechSynthesis.speak(utterance);
      } else {
        isScanning = true;
      }
    }

    window.onload = loadJsonData;
  </script>
</body>
</html>
