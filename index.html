<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>音が出るレジごっこ</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f7f9fa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #ff6b6b;
      font-size: 24px;
    }
    #preview-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      border: 4px solid #ffcbd1;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      display: block;
    }
    #result {
      margin-top: 20px;
      font-size: 28px;
      font-weight: bold;
      color: #333;
      min-height: 80px;
    }
    .btn {
      background-color: #ff6b6b;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn:active {
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <h1>🍞 おみせやさんレジ（おためし音が出る版） 🍎</h1>
  
  <div id="preview-container">
    <video id="video" autoplay playsinline></video>
  </div>

  <div id="result">QRコードを<br>うつしてね！</div>
  
  <button class="btn" onclick="startCamera()">カメラをスタート</button>

  <script>
    const video = document.getElementById('video');
    const resultDiv = document.getElementById('result');
    let isScanning = false;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    // お試し用の商品リスト
    const dummyProducts = [
      { name: "りんご", price: 120 },
      { name: "バナナ", price: 150 },
      { name: "メロンパン", price: 140 },
      { name: "いちごミルク", price: 110 },
      { name: "ポテトチップス", price: 180 },
      { name: "おにぎり", price: 130 },
      { name: "チョコレート", price: 200 }
    ];

    function startCamera() {
      // 最初にお音を出すための「許可」をスマホからもらうダミー音声を一瞬鳴らす
      playVoice("レジスタート");

      const constraints = {
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => { successStream(stream); })
        .catch(err => {
          navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(stream => { successStream(stream); });
        });
    }

    function successStream(stream) {
      video.srcObject = stream;
      video.setAttribute('playsinline', true);
      video.onloadedmetadata = function(e) {
        video.play().then(() => {
          isScanning = true;
          requestAnimationFrame(tick);
        });
      };
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'dontInvert',
        });

        if (code) {
          isScanning = false;
          
          const randomProduct = dummyProducts[Math.floor(Math.random() * dummyProducts.length)];
          
          // 画面書き換え
          resultDiv.innerHTML = `<span style="color:#ff6b6b;">${randomProduct.name}</span><br>${randomProduct.price}円`;
          
          // 音声を再生
          const text = `${randomProduct.name}、${randomProduct.price}えん`;
          playVoice(text);
        }
      }
      requestAnimationFrame(tick);
    }

    // Googleの音声データを使って直接音楽として再生する関数
    function playVoice(text) {
      const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=ja&client=tw-ob`;
      const audio = new Audio(audioUrl);
      
      audio.play().then(() => {
        // 音声が終わったら次のスキャンへ
        audio.onended = function() {
          setTimeout(() => {
            resultDiv.innerHTML = "つぎのQRコードを<br>うつしてね！";
            isScanning = true;
          }, 1000);
        };
      }).catch(err => {
        console.error("再生失敗:", err);
        // 万が一エラーでも次へ進める
        setTimeout(() => { isScanning = true; }, 2000);
      });
    }
  </script>
</body>
</html>
