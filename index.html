<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>レジごっこ (声の選択版)</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #f7f9fa; margin: 0; padding: 20px; }
    h1 { color: #ff6b6b; font-size: 24px; }
    #preview-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; border: 4px solid #ffcbd1; border-radius: 10px; overflow: hidden; background: #000; }
    video { width: 100%; display: block; }
    #result { margin-top: 20px; font-size: 28px; font-weight: bold; color: #333; min-height: 80px; }
    .btn { background-color: #ff6b6b; color: white; border: none; padding: 12px 24px; font-size: 18px; border-radius: 25px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    /* 声選択メニューのスタイル */
    #voice-select-container { margin: 15px 0; }
    select { padding: 8px 12px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; max-width: 80%; }
  </style>
</head>
<body>

  <h1>🍞 おみせやさんレジ 🍎</h1>
  
  <div id="preview-container">
    <video id="video" autoplay playsinline></video>
  </div>

  <div id="result">QRコードを<br>うつしてね！</div>

  <div id="voice-select-container">
    <label for="voice-select" style="font-size: 14px; color: #666; display: block; margin-bottom: 5px;">🗣️ レジの「こえ」をえらぶ:</label>
    <select id="voice-select"><option value="">端末の標準の音声</option></select>
  </div>

  <button class="btn" onclick="initAndStart()">カメラをスタート</button>

  <script>
    const video = document.getElementById('video');
    const resultDiv = document.getElementById('result');
    const voiceSelect = document.getElementById('voice-select');
    let isScanning = false;
    let productSheetsData = []; 

    // 🔊 スマホに搭載されている「声のリスト」を読み込んでメニューにセットする
    function populateVoiceList() {
      if (!('speechSynthesis' in window)) return;
      
      // 日本語(ja-JP)の声だけを抜き出す
      const voices = window.speechSynthesis.getVoices().filter(voice => voice.lang.includes('ja'));
      
      // メニューをリセットして追加
      voiceSelect.innerHTML = '';
      
      if (voices.length === 0) {
        voiceSelect.innerHTML = '<option value="">標準の音声 (日本語が見つかりません)</option>';
        return;
      }

      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.value = voice.name;
        // 「Kyoko」や「Siri」など、標準っぽいのをはじめに選ばれやすくする
        if (voice.name.includes('Kyoko') || voice.name.includes('Siri')) {
          option.selected = true;
        }
        voiceSelect.appendChild(option);
      });
    }

    // 音声リストの読み込み（ブラウザによってタイミングが異なるため両方でケア）
    if ('speechSynthesis' in window) {
      populateVoiceList();
      if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = populateVoiceList;
      }
    }

    async function loadJsonData() {
      try {
        const response = await fetch('./products.json'); 
        productSheetsData = await response.json();
        console.log("データの読み込みが完了しました！", productSheetsData);
      } catch (error) {
        console.error("JSONファイルの読み込みに失敗しました:", error);
      }
    }

    function initAndStart() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
      }
      startCamera();
    }

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false })
        .then(stream => {
          video.srcObject = stream;
          video.onloadedmetadata = () => video.play();
          isScanning = true;
          requestAnimationFrame(tick);
        })
        .catch(err => { alert('カメラの起動に失敗しました。'); });
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });

        if (code) {
          isScanning = false;
          const qrData = code.data.trim();
          resultDiv.innerHTML = "さがしています...";

          const product = productSheetsData.find(p => p.id === qrData);

          if (product) {
            const speakText = `${product.name}、${product.price}円！`;
            resultDiv.innerHTML = `<span style="color:#ff6b6b;">${product.name}</span><br>${product.price}円`;
            speakWithWebSpeech(speakText);
          } else {
            resultDiv.innerHTML = `<span style="color:#ff6b6b;">あれれ、みつからないよ</span><br><br><span style="font-size: 18px; color: #555;">読み取ったデータ:<br>${qrData}</span>`;
            speakWithWebSpeech("あれれ？みつからないよ");
            setTimeout(() => { isScanning = true; }, 3500); 
          }
        }
      }
      if (isScanning) { requestAnimationFrame(tick); }
    }

    function speakWithWebSpeech(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP'; 
        
        // ⚙️ ピッチ（高さ）と速度を調整して「よりかわいい声」のベースを作る
        utterance.rate = 1.05; // ほんの少し早口にして可愛く
        utterance.pitch = 1.25; // 声の高さを少し高めに設定（1.0が標準、2.0が最高）

        // 🗣️ メニューで選択された「声」を適用する
        const selectedVoiceName = voiceSelect.value;
        if (selectedVoiceName) {
          const voices = window.speechSynthesis.getVoices();
          const selectedVoice = voices.find(v => v.name === selectedVoiceName);
          if (selectedVoice) {
            utterance.voice = selectedVoice;
          }
        }

        utterance.onend = () => {
          setTimeout(() => { resultDiv.innerHTML = "つぎのQRコードを<br>うつしてね！"; isScanning = true; requestAnimationFrame(tick); }, 1500);
        };
        window.speechSynthesis.speak(utterance);
      } else {
        isScanning = true;
      }
    }

    window.onload = loadJsonData;
  </script>
</body>
</html>
